name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    # Optional hardening: add `environment: marketplace` here and store VSCE_PAT
    # as an environment secret to require manual approval before each publish.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version but package.json says $pkg_version."
            echo "Bump package.json, commit, then re-tag."
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
        id: version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm run package:vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          vsix="dist/out/premium-explorer-${VERSION}.vsix"
          test -f "$vsix" || { echo "::error::$vsix not found"; ls -la dist/out; exit 1; }

          # The gallery times out often enough to matter, and a version can never be
          # republished — so a dropped connection must not be allowed to burn one.
          # Two things make a retry safe:
          #   * the asset probe below, because a timeout can drop the response *after*
          #     the upload was accepted, and publishing again would then be rejected;
          #   * treating "already exists" as success, for the same reason, in case the
          #     accepted version isn't downloadable yet while it validates.
          asset="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/pepsik/vsextensions/premium-explorer/${VERSION}/vspackage"

          for attempt in 1 2 3; do
            echo "::group::vsce publish (attempt $attempt/3)"
            out="$(pnpm exec vsce publish --packagePath "$vsix" 2>&1)" && status=0 || status=$?
            echo "$out"
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Published $VERSION."
              exit 0
            fi
            if printf '%s' "$out" | grep -qiE 'already exists|duplicate'; then
              echo "::notice::$VERSION was already accepted; treating as published."
              exit 0
            fi
            if curl -sfL -o /dev/null --max-time 30 "$asset"; then
              echo "::notice::$VERSION is downloadable despite the error; not retrying."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Publish attempt $attempt failed and $VERSION is not in the gallery; retrying in 60s."
              sleep 60
            fi
          done

          echo "::error::vsce publish failed 3 times and $VERSION never reached the gallery."
          exit 1

      - name: Wait for Marketplace validation
        id: validate
        continue-on-error: true
        env:
          # Public repo: Actions minutes are free, so wait generously rather
          # than give up while the marketplace is still validating.
          TIMEOUT_SECONDS: '3600'
          INTERVAL_SECONDS: '30'
        run: |
          node scripts/wait-for-marketplace.mjs \
            pepsik.premium-explorer "${{ steps.version.outputs.version }}"

      - name: Upload VSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-explorer-${{ steps.version.outputs.version }}
          path: dist/out/*.vsix
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            # A warning, not a notice: silence here looks exactly like a release that
            # went fine, which is the one thing a notification exists to rule out.
            # Report only whether each is set, never any part of the value: this is
            # written straight into a public build log.
            have_token=no; [ -n "$TELEGRAM_BOT_TOKEN" ] && have_token=yes
            have_chat=no;  [ -n "$TELEGRAM_CHAT_ID" ]  && have_chat=yes
            echo "::warning::Telegram secrets missing (token set: $have_token, chat set: $have_chat) — no notification sent."
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          item_url="https://marketplace.visualstudio.com/items?itemName=pepsik.premium-explorer"

          if [ "$JOB_STATUS" = "success" ] && [ "$VALIDATION" = "success" ]; then
            text="[github] ✅ <b>Premium Explorer $GITHUB_REF_NAME</b> is live on the VS Code Marketplace.

          <a href=\"$item_url\">Marketplace listing</a> · <a href=\"$run_url\">workflow run</a>

          Install: <code>code --install-extension pepsik.premium-explorer</code>"
          elif [ "$JOB_STATUS" = "success" ]; then
            text="[github] ⏳ <b>Premium Explorer $GITHUB_REF_NAME</b> uploaded, but still showing <i>Verifying</i> after an hour.

          Nothing is wrong yet — validation occasionally runs long. It will go live on its own, or the marketplace will email you if it was rejected.

          <a href=\"$item_url\">Marketplace listing</a> · <a href=\"$run_url\">workflow run</a>"
          else
            text="[github] ❌ <b>Premium Explorer $GITHUB_REF_NAME</b> release failed (<code>$JOB_STATUS</code>).

          <a href=\"$run_url\">See the workflow run</a>"
          fi

          # A pasted secret picks up newlines more often than anything else here, and
          # they survive into the URL path.
          token="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          chat="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"

          # A real token is "<id>:<hash>". The URL below already supplies the "bot"
          # prefix, so a secret carrying one too gives /botbot<id>:<hash>/ — a 404
          # that reads exactly like a revoked token.
          case "$token" in
            bot*) echo "::warning::TELEGRAM_BOT_TOKEN begins with 'bot'. The URL adds that prefix itself; the secret should be just '<id>:<hash>'." ;;
          esac

          # Telegram routes on the token in the URL path, so an unrecognised token is a
          # 404 while a valid token with a bad chat id is a 400 "chat not found" — two
          # very different fixes behind two indistinguishable-looking failures. Ask
          # getMe first so the log names which one it is.
          if ! me="$(curl -sS --fail-with-body --max-time 30 \
            "https://api.telegram.org/bot${token}/getMe" 2>&1)"; then
            echo "::warning::Telegram does not recognise TELEGRAM_BOT_TOKEN — the release itself was unaffected."
            echo "::warning::getMe said: $me"
            echo "::warning::404 = no such token (revoked or mistyped; reissue via BotFather /token). 401 = malformed."
            exit 0
          fi
          echo "Authenticated as: $(printf '%s' "$me" | grep -o '"username":"[^"]*"' || echo 'unknown')"

          # `continue-on-error` on this step means a send failure is invisible unless
          # the response is printed: a bot that has never been messaged by the target
          # chat, or a wrong id, comes back as 400 with a description saying which.
          if ! response="$(curl -sS --fail-with-body \
            -X POST "https://api.telegram.org/bot${token}/sendMessage" \
            --data-urlencode "chat_id=${chat}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" 2>&1)"; then
            echo "::warning::Telegram accepted the token but rejected the message: $response"
            echo "::warning::Check TELEGRAM_CHAT_ID — and note a bot can only message a chat it has already been added to or messaged from."
            exit 0
          fi
          echo "Notification sent." 
