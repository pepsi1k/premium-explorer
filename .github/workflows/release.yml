name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    # Optional hardening: add `environment: marketplace` here and store VSCE_PAT
    # as an environment secret to require manual approval before each publish.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version but package.json says $pkg_version."
            echo "Bump package.json, commit, then re-tag."
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
        id: version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm run package:vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsix="dist/out/premium-explorer-${{ steps.version.outputs.version }}.vsix"
          test -f "$vsix" || { echo "::error::$vsix not found"; ls -la dist/out; exit 1; }
          pnpm exec vsce publish --packagePath "$vsix"

      - name: Wait for Marketplace validation
        id: validate
        continue-on-error: true
        env:
          # Public repo: Actions minutes are free, so wait generously rather
          # than give up while the marketplace is still validating.
          TIMEOUT_SECONDS: '3600'
          INTERVAL_SECONDS: '30'
        run: |
          node scripts/wait-for-marketplace.mjs \
            pepsik.premium-explorer "${{ steps.version.outputs.version }}"

      - name: Upload VSIX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-explorer-${{ steps.version.outputs.version }}
          path: dist/out/*.vsix
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: |
          # Normalise the two ways a pasted secret breaks the URL, since neither
          # reports itself clearly:
          #   whitespace (the GitHub UI keeps a trailing newline) -> curl exit 3,
          #     "URL using bad/illegal format", with no mention of Telegram at all;
          #   a `bot` prefix copied along with the token -> /botbot<id>:<secret>,
          #     which Telegram answers with a bare 404.
          TELEGRAM_BOT_TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN#bot}"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets not configured, skipping notification."
            exit 0
          fi

          # Never print $TELEGRAM_BOT_TOKEN or a URL containing it: trimming it above
          # produces a string GitHub's secret masking no longer recognises. Response
          # bodies are safe — Telegram never echoes the token back.
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          # Preflight against getMe, which tests only the token. Without it a bad
          # token surfaces as a 404 on sendMessage that reads like a missing chat.
          # The two failures mean different things and have different fixes:
          #   401 Unauthorized -> the token is well-formed but wrong or revoked;
          #   404 Not Found    -> it is malformed, i.e. not `<id>:<secret>`.
          if ! code="$(curl -sS -o /tmp/tg-me.json -w '%{http_code}' "$api/getMe")" \
             || [ "$code" != "200" ]; then
            echo "::warning::Telegram rejected the bot token (HTTP ${code:-none}): $(cat /tmp/tg-me.json 2>/dev/null)"
            echo "401 means the token is wrong or revoked; 404 means it is not shaped" \
                 "like <id>:<secret>. Check the TELEGRAM_BOT_TOKEN secret holds exactly" \
                 "what @BotFather issued — both halves, no 'bot' prefix."
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          item_url="https://marketplace.visualstudio.com/items?itemName=pepsik.premium-explorer"

          if [ "$JOB_STATUS" = "success" ] && [ "$VALIDATION" = "success" ]; then
            text="[github] ✅ <b>Premium Explorer $GITHUB_REF_NAME</b> is live on the VS Code Marketplace.

          <a href=\"$item_url\">Marketplace listing</a> · <a href=\"$run_url\">workflow run</a>

          Install: <code>code --install-extension pepsik.premium-explorer</code>"
          elif [ "$JOB_STATUS" = "success" ]; then
            text="[github] ⏳ <b>Premium Explorer $GITHUB_REF_NAME</b> uploaded, but still showing <i>Verifying</i> after an hour.

          Nothing is wrong yet — validation occasionally runs long. It will go live on its own, or the marketplace will email you if it was rejected.

          <a href=\"$item_url\">Marketplace listing</a> · <a href=\"$run_url\">workflow run</a>"
          else
            text="[github] ❌ <b>Premium Explorer $GITHUB_REF_NAME</b> release failed (<code>$JOB_STATUS</code>).

          <a href=\"$run_url\">See the workflow run</a>"
          fi

          # Keep the body: it carries the only useful diagnosis Telegram offers
          # ("chat not found", "bot was blocked by the user", …). The old
          # --fail-with-body was defeated by -o /dev/null, which discarded exactly
          # the text that explains the failure.
          code="$(curl -sS -o /tmp/tg-send.json -w '%{http_code}' \
            -X POST "$api/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true")" || code=''

          if [ "$code" != "200" ]; then
            echo "::warning::Telegram notification failed (HTTP ${code:-none}): $(cat /tmp/tg-send.json 2>/dev/null)"
            echo "The release itself is unaffected, and the token is known good — the" \
                 "preflight above passed. 400 'chat not found' means TELEGRAM_CHAT_ID is" \
                 "wrong; 403 means the bot was never started or has been blocked."
            exit 0
          fi
          echo "::notice::Telegram notified."
