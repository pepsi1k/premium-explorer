<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d15"/>
      <stop offset="1" stop-color="#0c0a07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d9a0"/>
      <stop offset="0.5" stop-color="#c2a057"/>
      <stop offset="1" stop-color="#8a6f3e"/>
    </linearGradient>
    <clipPath id="folderClip">
      <path d="M14,102 V36 a7,7 0 0 1 7,-7 h27 l10,11 h50 a7,7 0 0 1 7,7 v55 a7,7 0 0 1 -7,7 H21 a7,7 0 0 1 -7,-7 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="21" fill="none" stroke="#6d5730" stroke-width="2"/>

  <!-- folder body, split into three tabs -->
  <g clip-path="url(#folderClip)">
    <rect x="10" y="25" width="35" height="85" fill="#a01327"/>
    <rect x="45" y="25" width="36" height="85" fill="#1f8f34"/>
    <rect x="81" y="25" width="37" height="85" fill="#6b21b8"/>
    <!-- tab rail -->
    <rect x="10" y="52" width="110" height="3" fill="#000" opacity="0.45"/>
    <rect x="10" y="55" width="110" height="55" fill="#000" opacity="0.28"/>
    <!-- tab dividers -->
    <rect x="44" y="25" width="2" height="85" fill="#0c0a07" opacity="0.75"/>
    <rect x="80" y="25" width="2" height="85" fill="#0c0a07" opacity="0.75"/>
  </g>

  <path d="M14,102 V36 a7,7 0 0 1 7,-7 h27 l10,11 h50 a7,7 0 0 1 7,7 v55 a7,7 0 0 1 -7,7 H21 a7,7 0 0 1 -7,-7 Z"
        fill="none" stroke="url(#gold)" stroke-width="4"/>
  <path d="M16,54 H112" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
</svg>
